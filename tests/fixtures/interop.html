<!doctype html>
<html><head><meta charset="utf-8"><title>WinAuto WebGL Probe</title>
<style>html,body { margin:0; height:100%; overflow:hidden; background:#183050 }
canvas { width:100%; height:100%; display:block }</style></head>
<body><canvas id="surface" tabindex="0"></canvas><script>
// Synthetic GPU surface: no remote assets, credentials, or user application data.
const surface = document.querySelector('canvas');
const gl = surface.getContext('webgl');
let clicks = 0;
function paint() {
  surface.width = innerWidth; surface.height = innerHeight;
  gl.viewport(0, 0, surface.width, surface.height);
  gl.clearColor(clicks ? 0.1 : 0.7, clicks ? 0.7 : 0.1, 0.25, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  fetch('/state', {method:'POST', body:JSON.stringify({clicks,
    width:innerWidth, height:innerHeight, webgl:!!gl, userAgent:navigator.userAgent})});
}
surface.addEventListener('click', () => { clicks++; paint(); });
addEventListener('resize', paint);
paint();
</script></body></html>
